name: CI

on:
  push:
    branches: [master, feature/next]
  pull_request:

# A newer push to the same branch/PR supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows too: path separators, drive-letter case and case-insensitive
    # file systems have each broken the indexer on Windows only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck extension
        run: npx tsc --noEmit -p extension/tsconfig.json

      - name: Typecheck webview
        run: npx tsc --noEmit -p webview/tsconfig.json

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
